apiVersion: apps/v1
kind: Deployment
metadata:
name: api-deploy
spec:
replicas: 8
selector:
matchLabels:
app: api

strategy:
type: RollingUpdate
rollingUpdate:
maxUnavailable: 0
maxSurge: 1

template:
metadata:
labels:
app: api
annotations:
instrumentation.opentelemetry.io/inject-dotnet: "false"
prometheus.io/scrape: "true"
prometheus.io/port: "52323"
prometheus.io/path: "/metrics"

```
spec:

  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app: api

  volumes:
  - name: diagnostics
    emptyDir: {}

  containers:

  - name: cont-1
    image: vishalgogula123/quickplay:api-8

    ports:
    - containerPort: 5000

    lifecycle:
      postStart:
        exec:
          command:
          - /bin/sh
          - -c
          - |
            sleep 2 && \
            sed -i 's/\r//' /qc/MQS.ini && \
            sed -i '/^$/d' /qc/MQS.ini && \
            ln -sf /qc/MQS.ini /qc/mqs.ini

    env:
    - name: MQS_INI_PATH
      value: "/qc"

    - name: TNS_ADMIN
      value: "/qc"

    - name: DOTNET_gcServer
      value: "1"

    - name: DOTNET_ThreadPool_MinThreads
      value: "200"

    - name: DOTNET_GCConserveMemory
      value: "5"

    - name: DOTNET_System_Net_Http_SocketsHttpHandler_Http2MaxStreamsPerConnection
      value: "100"

    - name: DOTNET_DiagnosticPorts
      value: "/diag/port,suspend=n,listen=y"

    volumeMounts:
    - name: diagnostics
      mountPath: /diag

    readinessProbe:
      httpGet:
        path: /
        port: 5000
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

    livenessProbe:
      httpGet:
        path: /
        port: 5000
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3

    resources:
      requests:
        cpu: "1500m"
        memory: "2000Mi"
      limits:
        cpu: "2500m"
        memory: "4000Mi"

  - name: dotnet-monitor
    image: mcr.microsoft.com/dotnet/monitor:9

    ports:
    - containerPort: 52323
      name: monitor

    env:
    - name: DOTNETMONITOR_DiagnosticPort__ConnectionMode
      value: Listen

    - name: DOTNETMONITOR_DiagnosticPort__EndpointName
      value: /diag/port

    - name: DOTNETMONITOR_Urls
      value: http://*:52323

    volumeMounts:
    - name: diagnostics
      mountPath: /diag

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: "traffic-port"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:241431497213:certificate/16a08f0c-614f-49c4-9dc3-93e3d886b038
    # ✅ Added: increase ALB idle timeout for long-running requests
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120
    # ✅ Added: connection draining so in-flight requests finish before pod removed
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
spec:
  ingressClassName: alb
  rules:
    - host: quickplayapi1.mqbench.magnaquest.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-deploy
  # ✅ min stays 8 so all 4 nodes always have 2 pods each
  minReplicas: 8
  # ✅ Reduced from 20 → 10: 10 × 2500m = 25,000m, safe within 32 CPU budget
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # ✅ Raised from 60% → 75%: squeeze more work per pod before scaling out
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30       # ✅ scale up quickly under burst
      policies:
      - type: Pods
        value: 2
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120      # ✅ don't scale down too fast, avoid yo-yo
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
